name: APK Android

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'public/icon-512.png', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Instalar Capacitor
        working-directory: mobile
        run: npm install
      - name: Generar proyecto Android
        working-directory: mobile
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android
      - name: Compilar APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../puerto-ceniza.apk
      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: puerto-ceniza-apk
          path: puerto-ceniza.apk
      - name: Publicar descarga directa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Puerto Ceniza para Android
          body: |
            APK de Puerto Ceniza para Android. Descarga `puerto-ceniza.apk` en el teléfono, ábrelo y permite instalar apps de esta fuente.
            Necesita internet: la app abre el juego en línea a pantalla completa y en horizontal.
          files: puerto-ceniza.apk
          make_latest: true
